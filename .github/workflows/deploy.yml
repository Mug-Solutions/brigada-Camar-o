name: Deploy Brigada Camarão

on:
  push:
    branches: [main]
  workflow_dispatch:   # permite rodar manualmente pelo botao do GitHub

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write      # pra empurrar a imagem pro GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: ./sistema
          push: true
          tags: ghcr.io/mug-solutions/brigada-camarao:latest
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Deploy na VM (pull + up)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_CRM_HOST }}
          username: ${{ secrets.VM_SSH_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            cd ~/brigada
            docker compose pull
            docker compose up -d
            docker image prune -f
            docker compose ps
